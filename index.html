<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>公主的寻宝书</title>

<!-- 装到主屏后全屏跑 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="寻宝书">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFFBF4">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- 封面 -->
<section class="screen" id="s-cover">
  <!-- 开场片段：童话公主世界的生日。全部是公有领域意象（夜空、塔楼、皇冠、蛋糕、蜡烛、彩带），
       纯几何画出来，没有任何角色形象——仓库是公开的，见 CLAUDE.md 第九节那条边界。
       ⚠️ 竖屏 slice 只留中间约一半宽度，所有主体必须落在 x ∈ [280,720] 里。
       ⚠️ 凡是要做 CSS transform 动画的，定位一律交给**外面那层 g**：CSS 的 transform 会整个
       覆盖掉元素自己的 transform 属性，写在一起的话元素会被甩回 viewBox 原点（左上角）。
       ⚠️ 一个 filter 都不许挂（WebKit 会糊）。 -->
  <div class="opening" id="opening" hidden>
    <svg viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <rect class="op-night" x="-300" y="-300" width="1600" height="1300" fill="#3A3752"/>
      <circle class="op-moon" cx="655" cy="118" r="34" fill="#F6E7C4" fill-opacity=".9"/>
      <g transform="translate(330 92)"><path class="op-star s0" d="M0 -7 Q1.2 -1.2 7 0 Q1.2 1.2 0 7 Q-1.2 1.2 -7 0 Q-1.2 -1.2 0 -7 Z" fill="#F6E7C4"/></g>
      <g transform="translate(420 58)"><path class="op-star s1" d="M0 -7 Q1.2 -1.2 7 0 Q1.2 1.2 0 7 Q-1.2 1.2 -7 0 Q-1.2 -1.2 0 -7 Z" fill="#F6E7C4"/></g>
      <g transform="translate(520 118)"><path class="op-star s2" d="M0 -7 Q1.2 -1.2 7 0 Q1.2 1.2 0 7 Q-1.2 1.2 -7 0 Q-1.2 -1.2 0 -7 Z" fill="#F6E7C4"/></g>
      <g transform="translate(600 74)"><path class="op-star s3" d="M0 -7 Q1.2 -1.2 7 0 Q1.2 1.2 0 7 Q-1.2 1.2 -7 0 Q-1.2 -1.2 0 -7 Z" fill="#F6E7C4"/></g>
      <g transform="translate(676 148)"><path class="op-star s4" d="M0 -7 Q1.2 -1.2 7 0 Q1.2 1.2 0 7 Q-1.2 1.2 -7 0 Q-1.2 -1.2 0 -7 Z" fill="#F6E7C4"/></g>
      <g transform="translate(368 186)"><path class="op-star s5" d="M0 -7 Q1.2 -1.2 7 0 Q1.2 1.2 0 7 Q-1.2 1.2 -7 0 Q-1.2 -1.2 0 -7 Z" fill="#F6E7C4"/></g>
      <g transform="translate(556 214)"><path class="op-star s6" d="M0 -7 Q1.2 -1.2 7 0 Q1.2 1.2 0 7 Q-1.2 1.2 -7 0 Q-1.2 -1.2 0 -7 Z" fill="#F6E7C4"/></g>
      <g transform="translate(648 246)"><path class="op-star s7" d="M0 -7 Q1.2 -1.2 7 0 Q1.2 1.2 0 7 Q-1.2 1.2 -7 0 Q-1.2 -1.2 0 -7 Z" fill="#F6E7C4"/></g>

      <!-- 塔：单座、不对称（旗子偏一边）、上方不画光弧。跟地图上那座同一套画法，放大 4 倍 -->
      <g transform="translate(500 545) scale(4)">
        <g class="op-tower">
          <path d="M-8 0V-26H8V0Z" fill="#FFFBF4" stroke="#B79C7E" stroke-width="1.6" stroke-linejoin="round" pathLength="150"/>
          <path d="M-11 -26L0 -46L11 -26Z" fill="#D98324" fill-opacity=".38" stroke="#B79C7E" stroke-width="1.6" stroke-linejoin="round" pathLength="150"/>
          <path d="M0 -46V-56L9 -52L0 -48Z" fill="#B8912F" stroke="#B8912F" stroke-width="1" stroke-linejoin="round" pathLength="150"/>
          <path d="M-3.5 0V-7A3.5 3.5 0 0 1 3.5 -7V0" fill="none" stroke="#B79C7E" stroke-width="1.4" pathLength="150"/>
          <path class="op-win" d="M-4.5 -15V-19.5A1.6 1.6 0 0 1 -1.3 -19.5V-15Z" fill="#F6E7C4"/>
        </g>
      </g>

      <!-- 皇冠：公有领域的符号，纯几何。三颗珠取三个国度的正色 -->
      <g transform="translate(500 216)">
        <g class="op-crown">
          <path d="M-46 18L-46 2L-27 -12L-15 6L0 -26L15 6L27 -12L46 2L46 18Z"
                fill="#FFFBF4" stroke="#B8912F" stroke-width="2.6" stroke-linejoin="round"/>
          <rect x="-46" y="17" width="92" height="13" rx="3" fill="#B8912F" fill-opacity=".22" stroke="#B8912F" stroke-width="2.6"/>
          <circle cx="-27" cy="-17" r="4.6" fill="#C05A78"/>
          <circle cx="0" cy="-31" r="5.6" fill="#D98324"/>
          <circle cx="27" cy="-17" r="4.6" fill="#41618F"/>
        </g>
      </g>
      <g transform="translate(424 196)"><path class="op-spark k0" d="M0 -7 Q1.2 -1.2 7 0 Q1.2 1.2 0 7 Q-1.2 1.2 -7 0 Q-1.2 -1.2 0 -7 Z" fill="#F6E7C4"/></g>
      <g transform="translate(578 234)"><path class="op-spark k1" d="M0 -7 Q1.2 -1.2 7 0 Q1.2 1.2 0 7 Q-1.2 1.2 -7 0 Q-1.2 -1.2 0 -7 Z" fill="#F6E7C4"/></g>
      <g transform="translate(500 154)"><path class="op-spark k2" d="M0 -7 Q1.2 -1.2 7 0 Q1.2 1.2 0 7 Q-1.2 1.2 -7 0 Q-1.2 -1.2 0 -7 Z" fill="#F6E7C4"/></g>

      <!-- 蛋糕。三支蜡烛 = 三个国度 -->
      <g transform="translate(500 418)">
        <g class="op-cake">
          <ellipse cx="0" cy="60" rx="106" ry="12" fill="#FFFBF4" stroke="#B79C7E" stroke-width="2"/>
          <rect x="-78" y="2" width="156" height="58" rx="6" fill="#F6E3D2" stroke="#B79C7E" stroke-width="2"/>
          <path d="M-78 8q13 10 26 0t26 0 26 0 26 0 26 0 26 0" fill="none" stroke="#C05A78" stroke-width="3.4" stroke-linecap="round"/>
          <rect x="-52" y="-42" width="104" height="46" rx="5" fill="#FDF0E2" stroke="#B79C7E" stroke-width="2"/>
          <path d="M-52 -36q13 9 26 0t26 0 26 0 26 0" fill="none" stroke="#D98324" stroke-width="3.4" stroke-linecap="round"/>
          <rect x="-29" y="-70" width="6" height="28" rx="2" fill="#FFFBF4" stroke="#B79C7E" stroke-width="1.5"/>
          <rect x="-3" y="-74" width="6" height="32" rx="2" fill="#FFFBF4" stroke="#B79C7E" stroke-width="1.5"/>
          <rect x="23" y="-70" width="6" height="28" rx="2" fill="#FFFBF4" stroke="#B79C7E" stroke-width="1.5"/>
          <path d="M-29 -62h6M-3 -66h6M23 -62h6" stroke="#C05A78" stroke-width="2.4"/>
          <path class="op-smoke m0" d="M-26 -74q-5 -10 0 -19t0 -18" fill="none" stroke="#F6E7C4" stroke-width="2.4" stroke-linecap="round"/>
          <path class="op-smoke m1" d="M0 -78q-5 -10 0 -19t0 -18" fill="none" stroke="#F6E7C4" stroke-width="2.4" stroke-linecap="round"/>
          <path class="op-smoke m2" d="M26 -74q-5 -10 0 -19t0 -18" fill="none" stroke="#F6E7C4" stroke-width="2.4" stroke-linecap="round"/>
          <path class="op-flame f0" d="M-26 -86C-21 -79 -22 -74 -26 -73C-30 -74 -31 -79 -26 -86Z" fill="#E8A33C"/>
          <path class="op-flame f1" d="M0 -90C5 -83 4 -78 0 -77C-4 -78 -5 -83 0 -90Z" fill="#E8A33C"/>
          <path class="op-flame f2" d="M26 -86C31 -79 30 -74 26 -73C22 -74 21 -79 26 -86Z" fill="#E8A33C"/>
        </g>
      </g>

      <rect class="op-conf c0" x="300" y="-24" width="7" height="13" rx="2" fill="#E8A33C"/>
      <rect class="op-conf c1" x="334" y="-24" width="7" height="13" rx="2" fill="#D97A96"/>
      <rect class="op-conf c2" x="368" y="-24" width="7" height="13" rx="2" fill="#6B8FC4"/>
      <rect class="op-conf c3" x="402" y="-24" width="7" height="13" rx="2" fill="#E8C06A"/>
      <rect class="op-conf c4" x="436" y="-24" width="7" height="13" rx="2" fill="#D97A96"/>
      <rect class="op-conf c5" x="470" y="-24" width="7" height="13" rx="2" fill="#E8A33C"/>
      <rect class="op-conf c6" x="504" y="-24" width="7" height="13" rx="2" fill="#6B8FC4"/>
      <rect class="op-conf c7" x="538" y="-24" width="7" height="13" rx="2" fill="#D97A96"/>
      <rect class="op-conf c8" x="572" y="-24" width="7" height="13" rx="2" fill="#E8C06A"/>
      <rect class="op-conf c9" x="606" y="-24" width="7" height="13" rx="2" fill="#6B8FC4"/>
      <rect class="op-conf c10" x="640" y="-24" width="7" height="13" rx="2" fill="#E8A33C"/>
      <rect class="op-conf c11" x="674" y="-24" width="7" height="13" rx="2" fill="#D97A96"/>
      <rect class="op-conf c12" x="318" y="-24" width="7" height="13" rx="2" fill="#6B8FC4"/>
      <rect class="op-conf c13" x="386" y="-24" width="7" height="13" rx="2" fill="#E8C06A"/>
      <rect class="op-conf c14" x="454" y="-24" width="7" height="13" rx="2" fill="#D97A96"/>
      <rect class="op-conf c15" x="522" y="-24" width="7" height="13" rx="2" fill="#E8A33C"/>
      <rect class="op-conf c16" x="590" y="-24" width="7" height="13" rx="2" fill="#E8C06A"/>
      <rect class="op-conf c17" x="658" y="-24" width="7" height="13" rx="2" fill="#6B8FC4"/>
      <rect class="op-conf c18" x="700" y="-24" width="7" height="13" rx="2" fill="#E8A33C"/>
      <rect class="op-conf c19" x="352" y="-24" width="7" height="13" rx="2" fill="#D97A96"/>
    </svg>
    <div class="op-wish" id="op-wish"></div>
  </div>
  <div class="cover-em" id="cover-em"></div>
  <div class="kicker" id="cover-k"></div>
  <h1 class="cover-t" id="cover-t"></h1>
  <div class="cover-s" id="cover-s"></div>
  <button class="gbtn" id="cover-btn"></button>
  <div class="foot" id="cover-fl"></div>
</section>

<!-- 线索页 -->
<section class="screen" id="s-clue">
  <div class="stack">
    <div class="em-lg" id="clue-em"></div>
    <div class="kicker" id="clue-k"></div>
    <h1 class="clue-t" id="clue-t"></h1>
    <div class="rule" id="clue-rule"></div>
    <p class="body" id="clue-d"></p>
    <button class="gbtn" id="clue-btn"></button>
  </div>
  <div class="foot" id="clue-fl"></div>
</section>

<!-- 地图 / 雷达 -->
<section class="screen" id="s-map">
  <div class="map-mount" id="map-mount"></div>
  <div class="cluecard">
    <div class="kicker" id="cc-k"></div>
    <div class="cc-t" id="cc-t"></div>
    <div class="cc-d" id="cc-d"></div>
  </div>
  <div class="hud-hint" id="hud-hint"></div>
  <button class="gbtn recenter" id="recenter" hidden></button>
  <div class="disc" id="disc"></div>
  <button class="mapback" id="map-back">← 线索</button>
  <button class="gbtn map-cta" id="map-cta"></button>
</section>

<!-- 拍照 -->
<section class="screen dark" id="s-capture">
  <video id="cam" playsinline muted autoplay></video>
  <div class="cn c1"></div><div class="cn c2"></div>
  <div class="cn c3"></div><div class="cn c4"></div>

  <div class="pose">
    <div class="kicker" id="pose-k"></div>
    <div class="pose-t" id="pose-t"></div>
  </div>
  <div class="tip" id="cap-tip"></div>

  <div class="qr-scan" id="qr-scan" hidden>
    <div class="qr-frame"></div>
    <div class="qr-hint" id="qr-hint"></div>
  </div>

  <button class="pill top" id="btn-back">回地图</button>
  <button class="shutter" id="shutter" aria-label="拍照"></button>
  <button class="pill right" id="btn-flip">切换镜头</button>
  <button class="pill left" id="btn-skip" hidden></button>
</section>

<!-- 收信物 -->
<section class="screen" id="s-reveal">
  <div class="row">
    <img class="plate" id="rv-photo" alt="她拍的那张照片">
    <div class="rv-b">
      <div class="kicker" id="rv-k"></div>
      <h1 class="rv-t" id="rv-t"></h1>
      <p class="body" id="rv-d"></p>
      <button class="gbtn" id="rv-btn"></button>
    </div>
  </div>
</section>

<!-- 终章 -->
<section class="screen" id="s-finale">
  <div class="stack">
    <div class="fn-photos" id="fn-photos"></div>
    <h1 class="fn-t" id="fn-t"></h1>
    <p class="body" id="fn-d"></p>
    <button class="gbtn" id="fn-btn"></button>
  </div>
  <div class="letter" id="letter" hidden>
    <div class="letter-in">
      <div class="letter-body" id="letter-body"></div>
      <button class="gbtn ghost" id="letter-close">合上</button>
    </div>
  </div>
</section>

<!-- 走到第几站。点一下就换站——卡住时这排是她唯一的自救出口 -->
<nav class="steps" id="steps" hidden></nav>

<div class="toast" id="toast" hidden></div>

<!-- 扫码解码器。落盘不放 CDN：当天网络不通也必须能扫。
     加载失败只是 window.jsQR 为 undefined，app.js 会跳过扫码这一步，不影响主线。 -->
<script defer src="vendor/jsQR.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
